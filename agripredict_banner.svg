<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4ea"/>
      <stop offset="100%" stop-color="#cfe8d6"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f7d4f"/>
      <stop offset="100%" stop-color="#2c5c3a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f3d2b"/>
      <stop offset="100%" stop-color="#2f6e46"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- soleil discret -->
  <circle cx="1080" cy="70" r="46" fill="#f4c95d" opacity="0.85"/>

  <!-- champ / sol -->
  <rect x="0" y="230" width="1200" height="90" fill="url(#field)"/>
  <g stroke="#274d33" stroke-width="2" opacity="0.55">
    <line x1="0" y1="245" x2="1200" y2="245"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="278" x2="1200" y2="278"/>
    <line x1="0" y1="298" x2="1200" y2="298"/>
  </g>

  <!-- petites pousses stylisees -->
  <g stroke="#eaf6ec" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M60 230 C 55 210, 65 200, 60 185"/>
    <path d="M60 210 C 68 205, 74 198, 78 190"/>
    <path d="M60 210 C 52 205, 46 198, 42 190"/>

    <path d="M140 230 C 135 208, 148 198, 142 180"/>
    <path d="M142 205 C 150 200, 156 193, 160 185"/>
    <path d="M142 205 C 134 200, 128 193, 124 185"/>

    <path d="M1000 230 C 995 208, 1008 198, 1002 180"/>
    <path d="M1002 205 C 1010 200, 1016 193, 1020 185"/>
    <path d="M1002 205 C 994 200, 988 193, 984 185"/>
  </g>

  <!-- motif "classification" : points colores + frontiere de decision -->
  <g opacity="0.9">
    <path d="M780 40 Q 850 90 800 150 Q 760 190 830 225" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>

    <circle cx="740" cy="70" r="7" fill="#e07a5f"/>
    <circle cx="770" cy="100" r="7" fill="#e07a5f"/>
    <circle cx="720" cy="115" r="7" fill="#e07a5f"/>
    <circle cx="755" cy="140" r="7" fill="#e07a5f"/>

    <circle cx="880" cy="60" r="7" fill="#3d5a80"/>
    <circle cx="905" cy="95" r="7" fill="#3d5a80"/>
    <circle cx="860" cy="100" r="7" fill="#3d5a80"/>
    <circle cx="895" cy="135" r="7" fill="#3d5a80"/>

    <circle cx="800" cy="185" r="7" fill="#f4c95d"/>
    <circle cx="835" cy="205" r="7" fill="#f4c95d"/>
    <circle cx="790" cy="215" r="7" fill="#f4c95d"/>

    <circle cx="900" cy="180" r="7" fill="#81b29a"/>
    <circle cx="930" cy="205" r="7" fill="#81b29a"/>
    <circle cx="920" cy="150" r="7" fill="#81b29a"/>
  </g>

  <!-- titre -->
  <text x="60" y="120" font-size="58" font-weight="700" fill="url(#titleGrad)">AgriPredict</text>
  <text x="62" y="160" font-size="22" fill="#2f4b38">Classification de cultures agricoles avec Machine Learning</text>

  <!-- badges texte discrets -->
  <g font-size="15" fill="#2f4b38" opacity="0.85">
    <text x="62" y="195">Python</text>
    <circle cx="118" cy="191" r="3" fill="#2f4b38"/>
    <text x="130" y="195">scikit-learn</text>
    <circle cx="212" cy="191" r="3" fill="#2f4b38"/>
    <text x="224" y="195">Classification multi-classe</text>
  </g>
</svg>
